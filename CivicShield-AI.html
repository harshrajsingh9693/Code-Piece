<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {

	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */

	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {

	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;

	}
.leaflet-control-layers-toggle {

.leaflet-retina .leaflet-control-layers-toggle {

	}
.leaflet-touch .leaflet-control-layers-toggle {

	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {

.leaflet-control-layers-expanded .leaflet-control-layers-list {

.leaflet-control-layers-scrollbar {

.leaflet-control-layers label {

	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;

.leaflet-control-attribution,

.leaflet-left .leaflet-control-scale {

	white-space: nowrap;

.leaflet-control-scale-line:not(:first-child):not(:last-child) {

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;

	}
.leaflet-popup-content p {
	margin: 17px 0;

	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;

	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

	margin-right: -12px;
	border-left-color: #fff;
	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;

<style>
:root{
  --bg:#0b1220; --bg2:#0f1a2e; --surface:#122036; --surface2:#18294422;
  --card:#13223a; --card2:#0e1b2f; --line:#1f3352; --line2:#29406b;
  --text:#e8eefb; --muted:#93a5c4; --faint:#5d6f92;
  --brand:#2f7df6; --brand2:#22d3ee; --brandsoft:#2f7df622;
  --amber:#f59e0b; --red:#ef4444; --green:#22c55e; --purple:#a78bfa;
  --radius:14px; --radius-s:10px;
  --shadow:0 10px 30px rgba(3,10,25,.45);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}
button{font-family:inherit}
::selection{background:#2f7df655}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{line-height:1.25;font-weight:650}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:230px;min-height:100vh;background:linear-gradient(180deg,#0d1628,#0a1322);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;box-shadow:0 4px 14px #2f7df655}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:var(--faint);font-size:10.5px;font-weight:400;letter-spacing:.4px;text-transform:uppercase}
.nav{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.8px;font-weight:550;cursor:pointer;text-align:left;transition:.15s}
.nav button:hover{background:#ffffff08;color:var(--text)}
.nav button.active{background:var(--brandsoft);color:#dbeafe}
.nav button .ic{width:20px;text-align:center;font-size:16px;flex:none}
.nav .sep{margin:8px 6px;border-top:1px solid var(--line)}
.sidefoot{padding:12px 14px;border-top:1px solid var(--line)}
.rolechip{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#334f7d,#22d3ee55);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#eaf6ff;flex:none}
.rolechip .who b{display:block;font-size:13px}.rolechip .who span{font-size:11.5px;color:var(--faint)}
.btn-ghost-s{margin-top:10px;width:100%;padding:7px;border:1px solid var(--line2);background:#0e1b2f;color:var(--muted);border-radius:9px;font-size:12.5px;cursor:pointer}
.btn-ghost-s:hover{border-color:var(--brand);color:var(--text)}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:#0c1526cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:500}
.topbar h1{font-size:19px}
.topbar .sub{color:var(--faint);font-size:12.5px;margin-top:1px}
.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.content{padding:24px 26px;max-width:1240px;width:100%;margin:0 auto;flex:1}
.demo-note{display:flex;gap:9px;align-items:flex-start;background:#f59e0b14;border:1px solid #f59e0b45;color:#fcd34d;padding:10px 14px;border-radius:var(--radius-s);font-size:12.8px;margin-bottom:18px}
.demo-note .ic{flex:none}
/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.kpi{position:relative;overflow:hidden}
.kpi .num{font-size:30px;font-weight:700;letter-spacing:-.5px}
.kpi .lbl{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi .kic{position:absolute;right:14px;top:14px;font-size:20px;opacity:.9}
.kpi .trend{font-size:11.5px;margin-top:8px;color:var(--faint)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-size:13.8px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--brand),#1e6ae0);color:#fff;box-shadow:0 4px 14px #2f7df644}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-cyan{background:linear-gradient(135deg,#0ea5c9,var(--brand2));color:#04222b}
.btn-cyan:hover{filter:brightness(1.06)}
.btn-outline{background:#0e1b2f;border-color:var(--line2);color:var(--text)}
.btn-outline:hover{border-color:var(--brand)}
.btn-danger{background:#7f1d1d00;border-color:#ef444488;color:#fca5a5}
.btn-danger:hover{background:#ef444422}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{filter:brightness(1.08)}
.btn-sm{padding:6px 11px;font-size:12.3px;border-radius:8px}
.btn-lg{padding:14px 22px;font-size:15px}
.btn-block{width:100%}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.3px;font-weight:650;letter-spacing:.2px}
.b-critical{background:#ef444422;color:#fca5a5;border:1px solid #ef444455}
.b-high{background:#f59e0b1c;color:#fcd34d;border:1px solid #f59e0b50}
.b-medium{background:#2f7df61c;color:#93c5fd;border:1px solid #2f7df645}
.b-low{background:#64748b22;color:#cbd5e1;border:1px solid #64748b55}
.b-review{background:#a78bfa1c;color:#c4b5fd;border:1px solid #a78bfa50}
.s-open{background:#2f7df61c;color:#93c5fd;border:1px solid #2f7df645}
.s-ack{background:#a78bfa1c;color:#c4b5fd;border:1px solid #a78bfa50}
.s-assigned{background:#22d3ee1a;color:#67e8f9;border:1px solid #22d3ee45}
.s-pending{background:#f59e0b1c;color:#fcd34d;border:1px solid #f59e0b50}
.s-verified{background:#22c55e1a;color:#86efac;border:1px solid #22c55e50}
.s-rejected{background:#ef44441a;color:#fca5a5;border:1px solid #ef444455}
.sample-tag{background:#7c3aed18;color:#c4b5fd;border:1px dashed #a78bfa60;font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:600}
/* ---------- tables/queues ---------- */
.qrow{display:flex;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#0f1c31;margin-bottom:9px;cursor:pointer;transition:.15s}
.qrow:hover{border-color:var(--brand);transform:translateY(-1px)}
.qrow .sevdot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.qrow .qmain{flex:1;min-width:0}
.qrow .qtitle{font-weight:600;font-size:13.8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow .qsub{color:var(--faint);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.pscore{font-size:12px;font-weight:700;color:#dbeafe;background:#2f7df615;border:1px solid #2f7df63a;border-radius:8px;padding:4px 9px;flex:none}
.esc-flag{background:#ef444422;color:#fca5a5;border:1px solid #ef444455;border-radius:7px;padding:2px 7px;font-size:10.5px;font-weight:700}
/* ---------- forms ---------- */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
input.t,select.t,textarea.t{width:100%;background:#0c1a30;border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit;transition:.15s}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--brand);box-shadow:0 0 0 3px #2f7df626;outline:none}
textarea.t{resize:vertical;min-height:84px}
.field{margin-bottom:15px}
.err{color:#fca5a5;font-size:12.3px;margin-top:5px;display:none}
.err.show{display:block}
.hint{color:var(--faint);font-size:12px;margin-top:5px}
/* ---------- photos ---------- */
.photostrip{display:flex;gap:10px;flex-wrap:wrap}
.photothumb{position:relative;width:104px;height:104px;border-radius:11px;overflow:hidden;border:1px solid var(--line2);background:#0c1a30}
.photothumb img{width:100%;height:100%;object-fit:cover}
.photothumb .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:8px;border:0;background:#000000aa;color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.photothumb .rm:hover{background:#ef4444cc}
.photodrop{width:104px;height:104px;border:2px dashed var(--line2);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--faint);font-size:11px;cursor:pointer;background:#0c1a3088;text-align:center;padding:6px}
.photodrop:hover{border-color:var(--brand);color:var(--brand2)}
/* ---------- map ---------- */
.mapwrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#0d1830}
#map{height:100%;width:100%;background:#0d1830}
.map-full{height:calc(100vh - 220px);min-height:420px}
.map-half{height:360px}
.map-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);text-align:center;padding:30px;background:#0d1830;z-index:401}
.legend{position:absolute;bottom:18px;left:12px;z-index:400;background:#0b1426ee;border:1px solid var(--line2);border-radius:11px;padding:10px 13px;font-size:11.6px;backdrop-filter:blur(6px)}
.legend .li{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .dot{width:9px;height:9px;border-radius:50%}
.maptools{position:absolute;top:12px;right:12px;z-index:400;display:flex;flex-direction:column;gap:8px}
.mbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:#0b1426ee;color:var(--text);cursor:pointer;font-size:16px;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.mbtn:hover{border-color:var(--brand)}
.mapfilters{position:absolute;top:12px;left:12px;z-index:400;display:flex;gap:7px;flex-wrap:wrap;max-width:70%}
.mchip{background:#0b1426ee;border:1px solid var(--line2);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:11.8px;cursor:pointer;backdrop-filter:blur(6px)}
.mchip:hover{color:var(--text)}
.mchip.on{background:var(--brandsoft);border-color:var(--brand);color:#dbeafe}
.leaflet-container{font-family:var(--font);background:#0d1830}
.leaflet-popup-content-wrapper{background:#101f38;color:var(--text);border-radius:12px;border:1px solid var(--line2);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:#101f38;border:1px solid var(--line2)}
.leaflet-popup-content{margin:12px 15px;font-size:13px}
.leaflet-popup-close-button{color:var(--muted)!important}
.leaflet-control-zoom a{background:#101f38!important;color:var(--text)!important;border-color:var(--line2)!important}
.leaflet-control-attribution{background:#0b1426cc!important;color:#64748b!important;font-size:10px!important}
.leaflet-control-attribution a{color:#7aa2d8!important}
.hpin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 4px;transform:rotate(45deg);width:30px;height:30px;border:2px solid #0b1220;box-shadow:0 3px 10px rgba(0,0,0,.5);font-size:14px}
.hpin span{transform:rotate(-45deg)}
.hpin.c-critical{background:#ef4444}.hpin.c-high{background:#f59e0b}.hpin.c-medium{background:#2f7df6}.hpin.c-low{background:#64748b}.hpin.c-review{background:#a78bfa}
.hpin.c-done{background:#22c55e}
/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px #2f7df633}
.tl .ev .et{font-size:12.8px;font-weight:600}
.tl .ev .em{color:var(--faint);font-size:11.6px;margin-top:2px}
/* ---------- chat ---------- */
.copilot-fab{position:fixed;right:22px;bottom:22px;z-index:900;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 24px #2f7df666;display:flex;align-items:center;justify-content:center;transition:.2s}
.copilot-fab:hover{transform:scale(1.07)}
.copilot{position:fixed;right:20px;bottom:20px;z-index:950;width:380px;max-width:calc(100vw - 24px);height:540px;max-height:calc(100vh - 40px);background:#0e1b30;border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.cop-head{display:flex;align-items:center;gap:10px;padding:13px 15px;background:linear-gradient(135deg,#173462,#123046);border-bottom:1px solid var(--line)}
.cop-head .dot2{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.cop-head b{font-size:13.8px}
.cop-head small{display:block;font-size:10.8px;color:var(--muted)}
.cop-head .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;padding:4px 6px;border-radius:7px}
.cop-head .x:hover{background:#ffffff10;color:#fff}
.cop-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:9px 13px;border-radius:13px;font-size:13.2px;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:#1a2c4a;border:1px solid var(--line2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.user{background:linear-gradient(135deg,var(--brand),#1e6ae0);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg b{color:#9fe8ff}.msg a{color:#67e8f9;text-decoration:underline}
.typing{display:flex;gap:4px;padding:11px 14px;background:#1a2c4a;border-radius:13px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.cop-sug{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 10px}
.cop-sug button{background:#16294a;border:1px solid var(--line2);color:var(--brand2);border-radius:99px;font-size:11.5px;padding:5px 11px;cursor:pointer}
.cop-sug button:hover{border-color:var(--brand)}
.cop-in{display:flex;gap:9px;padding:11px;border-top:1px solid var(--line);background:#0d1930}
.cop-in input{flex:1;background:#0c1a30;border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13.2px;border-image:none}
.cop-in input:focus{outline:none;border-color:var(--brand)}
.cop-in button{width:40px;height:40px;border-radius:10px;border:0;background:var(--brand);color:#fff;cursor:pointer;font-size:15px;flex:none}
/* ---------- comparison slider ---------- */
.cmp{position:relative;width:100%;max-width:640px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);user-select:none;aspect-ratio:4/3;background:#0c1a30}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;cursor:ew-resize;box-shadow:0 0 10px #000}
.cmp .handle:after{content:'⇔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;background:#fff;color:#0b1220;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.cmp .tagl,.cmp .tagr{position:absolute;top:10px;background:#000000b0;padding:3px 10px;border-radius:7px;font-size:11.5px;font-weight:600}
.cmp .tagl{left:10px}.cmp .tagr{right:10px}
/* ---------- misc ---------- */
.split{display:grid;grid-template-columns:minmax(340px,1fr) 1.4fr;gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12.5px}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap}
.pill-tabs button{background:#0e1b2f;border:1px solid var(--line2);color:var(--muted);border-radius:99px;padding:7px 14px;font-size:12.6px;font-weight:600;cursor:pointer}
.pill-tabs button.on{background:var(--brandsoft);border-color:var(--brand);color:#dbeafe}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 20px;text-align:center;color:var(--faint)}
.empty .eic{font-size:36px;opacity:.7}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#12233f;border:1px solid var(--line2);border-left:3px solid var(--green);padding:12px 18px;border-radius:11px;font-size:13.3px;box-shadow:var(--shadow);z-index:1200;transition:.3s;max-width:92vw;display:flex;gap:10px;align-items:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.warn{border-left-color:var(--amber)}.toast.err{border-left-color:var(--red)}
.modal-bg{position:fixed;inset:0;background:#040a18b8;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{background:#0f1c33;border:1px solid var(--line2);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow)}
.modal h3{font-size:16.5px;margin-bottom:6px}
.stat-ok{color:var(--green)}.stat-warn{color:var(--amber)}.stat-bad{color:var(--red)}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.6px}
.bar-row .bl{width:120px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .btrack{flex:1;height:9px;background:#0c1a30;border-radius:6px;overflow:hidden}
.bar-row .bfill{height:100%;border-radius:6px}
.bar-row .bn{width:26px;text-align:right;color:var(--faint);font-size:11.5px}
/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login-left{position:relative;display:flex;flex-direction:column;justify-content:center;padding:6vh 7vw;background:radial-gradient(1000px 600px at 15% 10%,#14335f 0%,transparent 55%),radial-gradient(800px 500px at 90% 90%,#0e4a5e55 0%,transparent 50%),#0a1322;border-right:1px solid var(--line)}
.login-right{position:relative;background:#0c1626}
.login-right .maplabel{position:absolute;left:14px;bottom:14px;z-index:500;background:#0b1426e0;border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:12px;color:var(--muted);backdrop-filter:blur(6px)}
.lg-head{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.lg-head .logo{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 8px 28px #2f7df655}
.lg-head b{font-size:22px;letter-spacing:.2px}
.lg-head small{display:block;color:var(--brand2);font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase}
.tagline{font-size:clamp(26px,3.4vw,40px);font-weight:750;line-height:1.18;letter-spacing:-.6px;margin-bottom:14px}
.tagline em{font-style:normal;background:linear-gradient(90deg,var(--brand2),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-card{background:linear-gradient(180deg,#13223c,#0f1c31);border:1px solid var(--line2);border-radius:18px;padding:26px;max-width:430px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.role-btn{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line2);background:#0d1a30;border-radius:12px;cursor:pointer;color:var(--text);text-align:left;transition:.15s}
.role-btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.role-btn .ric{font-size:21px}
.role-btn b{font-size:13.2px;display:block}
.role-btn span{font-size:11.3px;color:var(--faint)}
.orline{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11.5px;margin:16px 0 0;text-transform:uppercase;letter-spacing:1px}
.orline:before,.orline:after{content:'';flex:1;border-top:1px solid var(--line)}
/* ---------- bottom nav (mobile) ---------- */
.bottomnav{display:none}
@media(max-width:960px){
  .sidebar{display:none}
  .content{padding:16px 14px}
  .topbar{padding:12px 14px}
  .g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .login-wrap{grid-template-columns:1fr}
  .login-right{display:none}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0d1628f2;border-top:1px solid var(--line);z-index:800;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1;background:none;border:0;color:var(--faint);font-size:10.6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 2px}
  .bottomnav button .ic{font-size:19px}
  .bottomnav button.active{color:var(--brand2)}
  body{padding-bottom:58px}
  .copilot{right:8px;left:8px;width:auto;bottom:66px}
  .copilot-fab{bottom:72px;right:14px;width:50px;height:50px}
  .map-full{height:calc(100vh - 300px);min-height:320px}
}
@media(max-width:560px){.g4,.g3{grid-template-columns:1fr 1fr}}

</style>

/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const daysAgo = d => (now() - d) / 86400000;
const fmtDate = t => new Date(t).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtD = t => new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
const kmDist = (a, b) => { const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); };

function toast(msg, kind) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  t.innerHTML = (kind === 'err' ? '⚠️ ' : kind === 'warn' ? '⏳ ' : '✅ ') + esc(msg);
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3400);
}

function synthPhoto(kind, seedNum) {
  const n = seedNum || 1;
  const shades = ['<circle cx="40" cy="70" r="24" fill="#050505"/><circle cx="40" cy="70" r="30" fill="none" stroke="#444" stroke-width="4"/>',
                  '<ellipse cx="60" cy="80" rx="40" ry="16" fill="#141414" stroke="#555" stroke-width="4"/>',
                  '<path d="M10 60 Q60 10 110 70" stroke="#f7c948" stroke-width="5" fill="none"/><circle cx="10" cy="60" r="6" fill="#f7c948"/>'];
  const after = '<rect width="120" height="120" fill="#3c3c3c"/><ellipse cx="60" cy="80" rx="40" ry="16" fill="#4a4a4a" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>';
  const body = kind === 'after' ? after : '<rect width="120" height="120" fill="#2e2e2e"/>' + shades[n % shades.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">${body}<rect x="4" y="4" width="112" height="16" rx="4" fill="#0b1220"/><text x="10" y="16" font-size="9" fill="#93a5c4" font-family="sans-serif">DEMO PHOTO · NOT REAL EVIDENCE</text></svg>`;

}

/* ---------- priority scoring (explainable, documented in-app) ----------
   This is a transparent on-device rule-based heuristic for the demo.
   It is NOT an AI safety inspection and never marks an area "safe".   */
function computePriority(rep) {
  const cat = CATS[rep.category] || CATS.other;
  const f = [];
  let score = cat.base;
  f.push(`${cat.label} base risk ${cat.base}/100`);
  if (rep.exposed) { score += 15; f.push('directly exposed to pedestrians or vehicles (+15)'); }
  const age = Math.max(0, daysAgo(rep.createdAt));
  if (age > 0.2) { const b = Math.min(15, Math.round(age * 3)); score += b; f.push(`report age ${age.toFixed(1)}d (+${b})`); }
  if (rep.evidence && rep.evidence.length) { score += 5; f.push('photo evidence attached (+5)'); }
  if (rep.description && rep.description.length > 40) { score += 3; f.push('detailed description (+3)'); }
  const related = relatedReports(rep).length;
  if (related) { const b = Math.min(15, related * 5); score += b; f.push(`${related + 1} independent reports about the same issue (+${b})`); }
  score = Math.max(0, Math.min(100, score));
  let band = score >= 80 ? 'critical' : score >= 65 ? 'high' : score >= 45 ? 'medium' : score >= 25 ? 'low' : 'needs_review';
  const urgent = rep.category === 'electrical' || rep.category === 'manhole';
  if (urgent) f.push('emergency rule: suspected live electrical hazard or open manhole → escalated for urgent human assessment');
  return { score, band, urgent, explanation: f };
}

function relatedReports(rep) {
  return DB.reports.filter(r => r.id !== rep.id && r.category === rep.category && kmDist(r, rep) < 0.15 && Math.abs(daysAgo(rep.createdAt) - daysAgo(r.createdAt)) < 14);
}

/* ---------- report CRUD ---------- */
function createReport(data) {
  const code = newCode();
  const r = Object.assign({
    id: 'r' + Math.floor(Math.random() * 1e9), code, reporter: ME ? ME.id : 'guest',
    workflowStatus: 'open', aiStatus: data.aiUsed ? 'analyzed' : 'not_analyzed',
    internalNotes: [], events: [], isSample: false, escalated: false,
    createdAt: now(), updatedAt: now(), evidence: [],
  }, data);
  r.events.push({ ts: now(), actor: ME ? ME.name : 'Guest', type: 'created', from: null, to: 'open', note: r.aiUsed ? 'Smart Assist (demo heuristic) used during reporting' : '' });
  const p = computePriority(r);
  r.priorityScore = p.score; r.band = p.band; r.explanation = p.explanation; r.urgent = p.urgent;
  if (p.urgent) { r.escalated = true; }
  DB.reports.unshift(r); saveDB();
  return r;
}
function updateReport(r, props, actor, eventType, from, to, note) {
  Object.assign(r, props);
  addEvent(r, actor, eventType, from, to, note);
  const p = computePriority(r); r.priorityScore = p.score; r.band = p.band; r.explanation = p.explanation; r.urgent = p.urgent;
  saveDB();
}
function getReport(idOrCode) { return DB.reports.find(r => r.id === idOrCode || r.code === idOrCode); }

  if (OPS.sort === 'oldest') list.sort((a, b) => a.createdAt - b.createdAt);
  if (OPS.sort === 'newest') list.sort((a, b) => b.createdAt - a.createdAt);

  const inner = `${pageHead('Municipal operations', `Severity-ranked queue · explainable priority scoring · ${CITY.name}`,

function areaSummary() {
  const areas = {};

  DB.reports.forEach(r => { const k = `${r.lat.toFixed(2)},${r.lng.toFixed(2)}`; cells[k] = (cells[k] || 0) + 1; });

}

/* ---------- Smart Assist (rule-based, honestly labeled) ---------- */
function smartAnalyze(text, category, hasPhoto) {
  const t = (text || '').toLowerCase();
  const found = [];
  const rules = [
    [/manhole|open pit|uncovered|hole in (the )?(footpath|road|pavement)/, 'manhole'],
    [/pothole|crater|road (is )?(broken|damaged)|speed bump/, 'pothole'],
    [/wire|cable|electric|spark|shock|current|livewire/, 'electrical'],
    [/footpath|sidewalk|pavement|slab/, 'footpath'],
    [/waterlog|flood|water log|stagnant|drain/, 'waterlogging'],
    [/tree|branch fell|obstruct|blocking the road/, 'tree'],
    [/streetlight|lamp|light (out|not working)|dark/, 'streetlight'],
  ];
  rules.forEach(([re, cat]) => { if (re.test(t)) found.push(cat); });
  const suggested = category || found[0] || null;
  const base = suggested ? CATS[suggested].base : 30;
  const band = base >= 85 ? 'critical' : base >= 60 ? 'high' : base >= 45 ? 'medium' : 'low';
  const risks = [];
  if (/child|school|kid/.test(t)) risks.push('children frequently pass this spot');
  if (/night|dark/.test(t)) risks.push('hazard may be invisible at night');
  if (/elderly|old person|wheelchair/.test(t)) risks.push('accessibility impact for elderly/disabled pedestrians');
  if (suggested === 'electrical') risks.push('possible live electrical conductor — risk of electrocution, especially in rain');
  if (suggested === 'manhole') risks.push('fall risk — uncovered depth can cause serious injury');
  if (suggested === 'waterlogging') risks.push('hidden submerged hazards and vehicle stalling risk');
  if (!risks.length) risks.push('standard risk for this hazard type based on category');
  const missing = [];
  if (!hasPhoto) missing.push('a clear photo of the hazard');
  if (!/when|since|yesterday|days?|hours?/.test(t)) missing.push('when you first noticed it');
  if (!/near|opposite|next to|beside|at the/.test(t)) missing.push('a nearby landmark for responders');
  const urgency = band === 'critical' ? 'Report immediately — municipal urgent-response rules apply to this hazard class.' : band === 'high' ? 'Report soon; expect prioritized scheduling.' : 'Report at your convenience; it will join the normal queue.';
  return {
    suggested, band, risks, missing, urgency,
    summary: t.length > 0 ? `Likely a ${suggested ? CATS[suggested].label.toLowerCase() : 'civic hazard'}${risks.length ? ' — ' + risks[0] : ''}.` : 'Unable to determine reliably from the text alone — please pick a category and add a short description.',
    confident: !!(suggested && t.length > 25),
  };
}
function runAnalyze() {
  readForm();
  const a = smartAnalyze(RPT.desc, RPT.category, RPT.photos.length > 0);
  RPT.aiOut = `<div style="border-top:1px solid var(--line);padding-top:12px">
    <div class="row small" style="gap:8px"><span class="badge b-medium">Smart Assist suggestion</span>${a.confident ? '<span class="hint">moderate confidence</span>' : '<span class="hint stat-warn">low confidence — please review</span>'}</div>
    <div class="small muted mt8"><b>Summary:</b> ${esc(a.summary)}</div>
    ${a.suggested ? `<div class="small muted mt8"><b>Suggested category:</b> ${CATS[a.suggested].icon} ${CATS[a.suggested].label} — <button class="btn btn-outline btn-sm" data-action="apply-cat">apply</button></div>` : ''}
    <div class="small muted mt8"><b>Potential risk factors:</b><ul style="margin:4px 0 0 16px">${a.risks.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
    <div class="small muted mt8"><b>Suggested urgency:</b> ${esc(a.urgency)}</div>
    ${a.missing.length ? `<div class="small muted mt8"><b>Would improve this report:</b> ${a.missing.map(m => esc(m)).join('; ')}</div>` : ''}
    <p class="hint">Suggestion only — you can correct every field below. If evidence is ambiguous, treat the suggestion as “unable to determine reliably”. This is a deterministic on-device heuristic, not a certified AI inspection.</p>
  </div>`;
  RPT.aiUsed = true;

}

/* ---------- photo handling ---------- */
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}
async function addPhotos(files) {
  for (const f of files) {
    if (!/^image\/(jpeg|jpg|png|webp)$/.test(f.type)) { toast('Only JPG, PNG or WebP images are allowed', 'err'); continue; }
    if (f.size > 8 * 1024 * 1024) { toast('Image too large (max 8 MB): ' + f.name, 'err'); continue; }
    try {
      const data = await compressImage(f, 900, 0.72);
      RPT.photos.push(data);
    } catch (e) { toast('Failed to process ' + f.name, 'err'); }
  }
  render();
  toast(RPT.photos.length + ' photo(s) attached');
}

/* ---------- GPS ---------- */
function useGPS(retry) {
  if (!navigator.geolocation) { toast('Geolocation not supported — set the pin manually on the map', 'warn'); RPT.locSource = RPT.locSource || 'manual'; if (!RPT.lat) { RPT.lat = CITY.lat + (Math.random() - .5) * .01; RPT.lng = CITY.lng + (Math.random() - .5) * .01; RPT.locSource = 'manual'; } render(); return; }
  toast('Requesting GPS permission…', 'warn');
  navigator.geolocation.getCurrentPosition(pos => {
    RPT.lat = pos.coords.latitude; RPT.lng = pos.coords.longitude;
    RPT.accuracy = pos.coords.accuracy; RPT.locSource = 'gps';
    toast('GPS location acquired (±' + Math.round(RPT.accuracy) + ' m)');
    render();
  }, err => {
    RPT.locSource = null;
    toast(err.code === 1 ? 'Location permission denied — drag the map pin to set the spot manually' : 'GPS unavailable — set the location manually', 'warn');
    const s = $('#locstatus'); if (s) s.innerHTML = '<span class="stat-bad">GPS unavailable/denied.</span> <span class="faint">Drag the pin on the map to set the location manually — it stays clearly labelled “manual”.</span>';
  }, { enableHighAccuracy: true, timeout: 10000 });
}

/* ---------- Civic Copilot (labeled demo assistant, grounded in stored data) ---------- */
let chatOpen = false, chatMsgs = [];
function copilotAnswer(q) {
  const t = q.toLowerCase();
  const open = DB.reports.filter(r => OPEN_STATES.includes(r.workflowStatus));
  const urgent = open.filter(r => r.escalated || r.band === 'critical').sort((a, b) => b.priorityScore - a.priorityScore);
  const code = (t.match(/cs-\s?\d+/i) || [])[0];
  const rep = code ? getReport(code.toUpperCase().replace(/\s/g, '')) : null;
  if (/urgent|critical|most important|priority list|escalat/.test(t)) {
    if (!urgent.length) return 'No reports currently meet the urgent-review rules. (Checked live against stored data.)';
    return `The most urgent unresolved hazards right now:\n${urgent.slice(0, 4).map(r => `• ${r.code} — ${r.title} (priority ${r.priorityScore}/100, ${r.band}${r.escalated ? ', ESCALATED' : ''})`).join('\n')}\n\nUrgent rule: suspected live wires and open manholes are always escalated for human assessment. I can open any of these — just say the code.`;
  }
  if (rep) {
    return `${rep.code} · ${rep.title}\nStatus: ${STATUS[rep.workflowStatus].label}\nSeverity: ${BANDS[rep.band].label} · priority ${rep.priorityScore}/100\n\nWhy this priority:\n${rep.explanation.map(e => '• ' + e).join('\n')}\n\nRemember: this is a transparent rule-based demo score, never a safety inspection.`;
  }
  if (/why .*priority|how .*score|severity/.test(t)) {
    return `The priority score is a documented on-device rule: hazard-type base risk, +15 if directly exposed to people/vehicles, up to +15 for report age, +5 with photo evidence, up to +15 for duplicate confirmations. Suspected live wires and open manholes are always escalated. It never declares an area safe.\nAsk me "why is CS-1001 marked high priority" for a specific report.`;
  }
  if (/how (do i|to) report|report a hazard|submit/.test(t)) {
    return `To report a hazard: tap “Report a hazard”, attach a photo (optional), set your location with GPS or by dragging the map pin, pick a category and write one or two sentences, then Submit. You'll get a report ID like CS-1012 to track it. If Smart Assist is unsure, it says so — you can always report manually.`;
  }
  if (/pothole|manhole|wire|footpath|waterlog|streetlight|tree/.test(t) && /show|list|near|unresolved|open/.test(t)) {
    const cat = Object.keys(CATS).find(k => t.includes(k.slice(0, 5)) || (CATS[k].label.toLowerCase().split(/[^a-z]+/).some(w => w.length > 4 && t.includes(w))));
    const list = open.filter(r => !cat || r.category === cat).slice(0, 5);
    return `Unresolved ${cat ? CATS[cat].label.toLowerCase() : ''} reports currently stored:\n${list.map(r => `• ${r.code} — ${r.title} (${BANDS[r.band].label}, ${STATUS[r.workflowStatus].label})`).join('\n') || '• none open right now'}\n\n(Counted live from the local database.)`;
  }
  if (/evidence|verify|verification|approve|after-photo/.test(t)) {
    return `Repair verification needs: the worker's after-photo and repair note, submitted from the worker portal. A reviewer compares before/after evidence and records approve/reject with a reason. Approval creates a verified work record on the worker's portable passport. A photo alone proves only that the photo shows the submitted scene — reviewers make the judgment.`;
  }
  if (/worker|contractor|passport|work record|history/.test(t)) {
    const recs = DB.workRecords.filter(w => w.passportSlug === 'suresh-patel');
    if (!recs.length) return 'No verified work records yet.';
    return `Suresh Patel's work passport shows ${recs.length} verified record(s):\n${recs.map(w => `• Job ${w.reportCode} — ${CATS[w.category].label}, completed ${fmtD(w.completionDate)}, verified ${fmtD(w.verifiedAt)}`).join('\n')}\n\nOpen the Work passport tab for the QR code. (Authorized data only.)`;
  }
  if (/status|acknowledg|assigned/.test(t)) {
    return `Report statuses: Open (just submitted) → Acknowledged (operator has seen it) → Under review → Assigned (worker has the job) → Pending verification (repair evidence submitted) → Verified repair or Rejected (needs better evidence). Every change is recorded in the report's event timeline.`;
  }
  if (/stat|how many|summary|overview/.test(t)) {
    return `Current stored data: ${DB.reports.length} reports, ${open.length} unresolved, ${DB.reports.filter(r => r.escalated).length} escalated, ${DB.reports.filter(r => r.workflowStatus === 'verified').length} verified repairs, ${DB.workRecords.length} verified work records. All computed from the live local database — never invented.`;
  }
  if (/hi|hello|help|what can you/.test(t)) {
    return `Hi! I'm Civic Copilot — a clearly-labeled demo assistant grounded in this app's stored data. Try:\n• "What are the most urgent hazards?"\n• "Why is CS-1003 marked critical?"\n• "Show unresolved pothole reports"\n• "What evidence is needed to verify a repair?"\n• "Show the contractor's verified work records"`;
  }
  return `I couldn't match that to stored data. I only answer from real records here — I never invent report IDs or statistics. Try "most urgent hazards", "why is CS-1001 high priority", or "how do I report a hazard".`;
}

    return;
  }
  const sug = e.target.closest('[data-sug]'); if (sug) { sendChat(sug.dataset.sug); return; }
  const openR = e.target.closest('[data-open-report]');
  if (openR) { readFormIfReport(); const code = openR.dataset.openReport; if (CURRENT.startsWith('#/ops')) showOpsDetail(code); else openReportModal(code); return; }
  const openW = e.target.closest('[data-open-work]');
  if (openW) { const w = DB.workRecords.find(x => x.id === openW.dataset.openWork); if (w) { const r = getReport(w.reportCode); if (r) openReportModal(w.reportCode); } return; }
  const wt = e.target.closest('[data-wtab]'); if (wt) { WORK_TAB = wt.dataset.wtab; render(); return; }
  const myt = e.target.closest('[data-mytabs]'); if (myt) { MY_TAB = myt.dataset.mytabs; render(); return; }
  const wa = e.target.closest('[data-wact]');
  if (wa) { workerAction(wa.dataset.wact, wa.dataset.code); return; }
  const va = e.target.closest('[data-vact]');
  if (va) { reviewAction(va.dataset.vact, va.dataset.sid); return; }
  const oa = e.target.closest('[data-act]');
  if (oa) { operatorAction(oa.dataset.act, oa.dataset.code); return; }
  const mf = e.target.closest('[data-mfilter]');
  if (mf) {
    const k = mf.dataset.mfilter, v = mf.dataset.val;
    if (k === 'band') MAP_STATE.band = MAP_STATE.band === v ? null : v;
    if (k === 'status') MAP_STATE.status = MAP_STATE.status ? null : 'open-only';
    if (k === 'cat') { const order = Object.keys(CATS); MAP_STATE.cat = MAP_STATE.cat ? null : 'manhole'; toast('Category filter demo: cycling to manhole — extend via config'); }
    $$('.mapfilters [data-mfilter]').forEach(b => {
      const bk = b.dataset.mfilter, bv = b.dataset.val;
      const on = (bk === 'band' && MAP_STATE.band === bv) || (bk === 'status' && MAP_STATE.status) || (bk === 'cat' && MAP_STATE.cat);
      b.classList.toggle('on', !!on);
    });
    refreshMapMarkers(); return;
  }
  if (e.target.classList && e.target.classList.contains('modal-bg')) e.target.remove();
});
function readFormIfReport() { if (CURRENT.startsWith('#/report') && RPT) readForm(); }
document.addEventListener('input', e => {
  if (e.target.id === 'mapsearch') { MAP_STATE.q = e.target.value; refreshMapMarkers(); }
  if (e.target.id === 'ops-q') { OPS.q = e.target.value; const l = $('#opslist'); const list = opsFilteredList(); l.innerHTML = list.map(r => reportRow(r)).join('') || '<div class="empty"><div class="eic">🔍</div>No matches.</div>'; }
  if (e.target.id === 'photoin' && e.target.files.length) addPhotos(Array.from(e.target.files));
  if (e.target.id && e.target.id.startsWith('after-')) {
    const code = e.target.id.slice(6); const f = e.target.files[0]; if (!f) return;
    if (!/^image\/(jpeg|jpg|png|webp)$/.test(f.type) || f.size > 8 * 1024 * 1024) { toast('Invalid photo (JPG/PNG/WebP, max 8 MB)', 'err'); return; }
    compressImage(f, 900, 0.72).then(d => { const r = getReport(code); r._after = d; render(); toast('After-photo attached'); });
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ops-sort') { OPS.sort = e.target.value; render(); }
  if (e.target.id === 'ops-status') { OPS.status = e.target.value; render(); }
  if (e.target.id === 'ops-cat') { OPS.cat = e.target.value; render(); }
});
function opsFilteredList() {
  let list = DB.reports.slice();
  if (OPS.status === 'open-only') list = list.filter(r => OPEN_STATES.includes(r.workflowStatus) || r.workflowStatus === 'pending_verification' || r.workflowStatus === 'rejected');
  if (OPS.cat) list = list.filter(r => r.category === OPS.cat);
  if (OPS.q) { const q = OPS.q.toLowerCase(); list = list.filter(r => r.title.toLowerCase().includes(q) || r.code.toLowerCase().includes(q)); }
  if (OPS.sort === 'priority') list.sort((a, b) => (b.escalated - a.escalated) || (b.priorityScore - a.priorityScore));
  if (OPS.sort === 'oldest') list.sort((a, b) => a.createdAt - b.createdAt);
  if (OPS.sort === 'newest') list.sort((a, b) => b.createdAt - a.createdAt);
  return list;
}
function locateMe() {
  if (!navigator.geolocation) { toast('Geolocation not supported', 'warn'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    if (activeMap) activeMap.setView([p.coords.latitude, p.coords.longitude], 15);
    toast('Centered on your location (±' + Math.round(p.coords.accuracy) + ' m)');
  }, () => toast('Location unavailable or denied — pan the map manually', 'warn'), { timeout: 8000 });
}
function showOpsDetail(code) {
  const r = getReport(code); if (!r) return;
  if (r.priorityScore == null) { const p = computePriority(r); r.priorityScore = p.score; r.band = p.band; r.explanation = p.explanation; r.urgent = p.urgent; saveDB(); }
  $('#opsdetail').innerHTML = opsDetail(r);
}
function operatorAction(act, code) {
  const r = getReport(code); if (!r) return;
  if (act === 'ack') { updateReport(r, { workflowStatus: 'acknowledged' }, ME.name, 'acknowledged', r.workflowStatus, 'acknowledged', 'Operator acknowledged the report'); toast(code + ' acknowledged'); }
  if (act === 'review') { updateReport(r, { workflowStatus: 'in_review' }, ME.name, 'in_review', r.workflowStatus, 'in_review', 'Under active review'); toast(code + ' marked under review'); }
  if (act === 'escalate') { updateReport(r, { escalated: true }, ME.name, 'escalated', r.workflowStatus, r.workflowStatus, 'ESCALATED by operator — suspected immediate danger, urgent human assessment required'); toast(code + ' escalated for urgent assessment', 'warn'); }
  if (act === 'note') { const v = $('#ops-note'); if (v && v.value.trim()) { r.internalNotes.push({ text: v.value.trim(), by: ME.name, ts: now() }); addEvent(r, ME.name, 'internal_note', null, null, 'Internal note added'); saveDB(); toast('Internal note added'); } }
  if (act === 'assign') { assignModal(r); return; }
  render();
}
function assignModal(r) {
  const m = document.createElement('div'); m.className = 'modal-bg';
  const workers = [{ id: 'u-worker', name: 'Suresh Patel · Road & footpath crew' }, { id: 'w-2', name: 'Vikram Singh · Electrical dept (demo)' }, { id: 'w-3', name: 'Lakshmi Devi · Drainage crew (demo)' }];
  m.innerHTML = `<div class="modal"><h3>Assign ${r.code}</h3><p class="small muted">${esc(r.title)}</p>
    <div class="mt16">${workers.map(w => `<button class="role-btn" style="width:100%;margin-bottom:8px" data-pick-worker="${w.id}" data-pick-name="${esc(w.name)}"><span class="ric">👷</span><span><b>${esc(w.name.split(' · ')[0])}</b><span>${esc(w.name.split(' · ')[1] || '')}</span></span></button>`).join('')}</div>
    <p class="hint">Demo roster. In production this list comes from an authenticated municipal worker directory.</p></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e2 => {
    if (e2.target === m) m.remove();
    const pk = e2.target.closest('[data-pick-worker]');
    if (pk) {
      const wid = pk.dataset.pickWorker, wname = pk.dataset.pickName.split(' · ')[0];
      r.assignment = { workerId: wid, workerName: wname, assignedBy: ME.name, assignedAt: now(), accepted: wid === 'u-worker' };
      updateReport(r, { workflowStatus: 'assigned' }, ME.name, 'assigned', r.workflowStatus, 'assigned', 'Assigned to ' + wname + (wid === 'u-worker' ? ' — visible in worker portal' : ' (demo roster)'));
      m.remove(); toast(r.code + ' assigned to ' + wname); render();
    }
  });
}
function workerAction(act, code) {
  const r = getReport(code); if (!r || !r.assignment) return;
  if (act === 'accept') { r.assignment.accepted = true; addEvent(r, ME.name, 'assignment_accepted', null, null, 'Worker accepted the assignment'); saveDB(); toast('Job accepted'); }
  if (act === 'submit-repair') {
    const note = $('#wnote-' + code);
    if (!note || !note.value.trim() || note.value.trim().length < 8) { toast('Add a repair note (8+ characters)', 'err'); return; }
    if (!r._after) { toast('Attach an after-photo — it is required for verification', 'err'); return; }
    const sub = { id: 'rs-' + Math.floor(Math.random() * 1e6), reportCode: r.code, reportId: r.id, workerId: ME.id, workerName: ME.name, note: note.value.trim(), afterPhoto: r._after, submittedAt: now(), status: 'pending' };
    DB.repairs.push(sub);
    updateReport(r, { workflowStatus: 'pending_verification' }, ME.name, 'repair_submitted', r.workflowStatus, 'pending_verification', 'After-photo and repair note submitted for verification');
    toast('Repair evidence submitted — pending verification');
  }
  render();
}
function reviewAction(act, sid) {
  const s = DB.repairs.find(x => x.id === sid); if (!s) return;
  const r = getReport(s.reportCode) || getReport(s.reportId); if (!r) return;
  const noteEl = $('#vnote-' + sid); const note = noteEl ? noteEl.value.trim() : '';
  if (note.length < 8) { toast('A recorded reason is required (8+ characters)', 'err'); return; }
  s.reviewerNote = note; s.reviewedBy = ME.name; s.reviewedAt = now();
  if (act === 'approve') {
    s.status = 'approved';
    updateReport(r, { workflowStatus: 'verified' }, ME.name, 'repair_verified', r.workflowStatus, 'verified', note);
    const rec = { id: 'wr-' + Math.floor(Math.random() * 1e6), passportSlug: 'suresh-patel', reportCode: r.code, category: r.category, completionDate: s.submittedAt, status: 'verified', verifiedAt: now(), verifiedBy: 'Municipal verification reviewer (' + ME.roleLabel + ')' };
    DB.workRecords.push(rec);
    toast(r.code + ' verified — work record added to ' + s.workerName + "'s passport");
  } else {
    s.status = 'rejected';
    updateReport(r, { workflowStatus: 'rejected' }, ME.name, 'repair_rejected', r.workflowStatus, 'rejected', note);
    toast(r.code + ' rejected — worker can resubmit evidence', 'warn');
  }
  render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $('.modal-bg'); if (m) m.remove(); if (chatOpen) { chatOpen = false; render(); } } });

/* ---------- boot ---------- */
loadDB();
restoreSession();
render();

</script>
</body>
